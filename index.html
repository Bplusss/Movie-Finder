<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movie Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0b09;
    --bg-elev:#181410;
    --bg-elev-2:#211b15;
    --stroke:#332b22;
    --text:#f3eee6;
    --text-dim:#b6ac9d;
    --text-faint:#847a6c;
    --gold:#c9a227;
    --gold-soft:#e6c65c;
    --crimson:#9c2b3b;
    --crimson-soft:#c04759;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  ::selection{background:var(--gold);color:#000;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  #app{max-width:900px;margin:0 auto;padding:0 20px 80px;}

  /* NAV */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px;border-bottom:1px solid var(--stroke);margin-bottom:36px;position:sticky;top:0;background:linear-gradient(var(--bg) 85%, transparent);z-index:20;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .navlinks{display:flex;gap:6px;}
  .navlinks button{background:none;border:none;color:var(--text-dim);font-size:14px;padding:8px 14px;border-radius:999px;transition:.15s;}
  .navlinks button.active,.navlinks button:hover{background:var(--bg-elev);color:var(--text);}

  /* HERO */
  .hero{text-align:center;padding:20px 0 30px;}
  .hero h1{font-size:clamp(26px,5vw,40px);font-weight:600;margin:0 0 10px;line-height:1.15;}
  .hero .sub{color:var(--text-dim);font-size:16px;margin:0 0 34px;}

  .search-wrap{background:var(--bg-elev);border:1px solid var(--stroke);border-radius:20px;padding:8px;max-width:640px;margin:0 auto 16px;display:flex;gap:8px;box-shadow:0 20px 60px -30px rgba(0,0,0,.6);}
  .search-wrap textarea{flex:1;resize:none;background:transparent;border:none;color:var(--text);font-size:15px;padding:14px 8px 14px 16px;font-family:'Inter',sans-serif;outline:none;min-height:26px;max-height:120px;line-height:1.4;}
  .search-wrap textarea::placeholder{color:var(--text-faint);}
  .btn-find{background:var(--gold);color:#1a1204;border:none;border-radius:14px;padding:0 22px;font-weight:600;font-size:14px;white-space:nowrap;transition:.15s;}
  .btn-find:hover{background:var(--gold-soft);}
  .btn-find:disabled{opacity:.5;cursor:default;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px;margin:0 auto;}
  .chip{background:var(--bg-elev);border:1px solid var(--stroke);color:var(--text-dim);padding:8px 14px;border-radius:999px;font-size:13px;transition:.15s;}
  .chip:hover{border-color:var(--gold);color:var(--text);}

  .criteria-toggle{text-align:center;margin-top:18px;}
  .criteria-toggle button{background:none;border:none;color:var(--text-faint);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;}
  .criteria-box{max-width:640px;margin:10px auto 0;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:10px;padding:12px 16px;font-size:12.5px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:6px;}
  .tag-pill{background:var(--bg-elev-2);border:1px solid var(--stroke);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--gold-soft);}

  .ad{max-width:640px;margin:26px auto;border:1px dashed var(--stroke);border-radius:12px;padding:16px;text-align:center;color:var(--text-faint);font-size:11px;letter-spacing:2px;font-weight:600;}

  /* RESULTS */
  .results-head{text-align:center;margin:8px 0 24px;}
  .results-head h2{font-size:24px;margin:0 0 4px;}
  .results-head p{color:var(--text-faint);font-size:13.5px;margin:0;}

  .loading{text-align:center;padding:60px 0;color:var(--text-dim);}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--stroke);border-top-color:var(--gold);margin:0 auto 16px;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
  .card{background:var(--bg-elev);border:1px solid var(--stroke);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;position:relative;}
  .card.watched{opacity:.55;}
  .poster{height:150px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:15px;text-align:center;padding:10px;color:rgba(255,255,255,.92);position:relative;}
  .poster .yr{position:absolute;top:8px;left:10px;font-size:11px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;}
  .poster .rt{position:absolute;top:8px;right:10px;font-size:11px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .card-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .genres-row{display:flex;flex-wrap:wrap;gap:5px;}
  .genre-tag{font-size:10.5px;color:var(--text-dim);border:1px solid var(--stroke);border-radius:999px;padding:2px 8px;}
  .synopsis{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .why{background:var(--bg-elev-2);border-left:2px solid var(--gold);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text-dim);}
  .why b{color:var(--gold-soft);font-weight:600;display:block;font-size:11px;margin-bottom:3px;letter-spacing:.3px;}
  .meta-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-faint);}
  .quality-stars{color:var(--gold);}
  .like-pct{color:var(--crimson-soft);}
  .avail-row{display:flex;flex-wrap:wrap;gap:5px;}
  .avail-badge{font-size:10px;border:1px solid var(--stroke);border-radius:5px;padding:2px 6px;color:var(--text-faint);}
  .avail-note{font-size:9.5px;color:var(--text-faint);font-style:italic;}
  .btn-watched{margin-top:auto;background:none;border:1px solid var(--stroke);color:var(--text-dim);border-radius:999px;padding:9px;font-size:12.5px;transition:.15s;}
  .btn-watched:hover{border-color:var(--gold);color:var(--text);}
  .badge-done{position:absolute;top:10px;right:10px;background:var(--crimson);color:#fff;font-size:10.5px;padding:3px 9px;border-radius:999px;z-index:2;}
  .badge-live{position:absolute;top:10px;left:10px;background:var(--gold);color:#1a1204;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;z-index:2;}

  .refine{text-align:center;margin-top:32px;}
  .refine p{color:var(--text-faint);font-size:14px;margin:0 0 12px;}
  .btn-again{background:var(--bg-elev);border:1px solid var(--stroke);color:var(--text);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;transition:.15s;}
  .btn-again:hover{border-color:var(--crimson);}
  .btn-newsearch{background:none;border:none;color:var(--text-faint);font-size:12.5px;margin-top:14px;text-decoration:underline;text-underline-offset:3px;}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--bg-elev);border:1px solid var(--stroke);border-radius:16px;padding:26px;max-width:400px;width:100%;}
  .modal h3{margin:0 0 4px;font-size:19px;}
  .modal .mv-title{color:var(--gold-soft);}
  .modal .q{margin:20px 0 8px;font-size:13.5px;color:var(--text-dim);}
  .stars-input{display:flex;gap:6px;font-size:26px;}
  .stars-input span{cursor:pointer;color:var(--stroke);transition:.1s;}
  .stars-input span.filled{color:var(--gold);}
  .stars-input.fit span.filled{color:var(--crimson-soft);}
  .modal-actions{display:flex;gap:10px;margin-top:24px;}
  .btn-save{flex:1;background:var(--gold);color:#1a1204;border:none;border-radius:10px;padding:11px;font-weight:600;font-size:14px;}
  .btn-cancel{background:none;border:1px solid var(--stroke);color:var(--text-dim);border-radius:10px;padding:11px 16px;font-size:14px;}

  /* HISTORY */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:30px;}
  .stat-box{background:var(--bg-elev);border:1px solid var(--stroke);border-radius:12px;padding:16px;text-align:center;}
  .stat-box .num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--gold-soft);}
  .stat-box .lbl{font-size:11px;color:var(--text-faint);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
  .hist-row{display:flex;gap:14px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:12px;padding:14px;margin-bottom:10px;align-items:center;}
  .hist-poster{width:52px;height:70px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:11px;font-weight:600;text-align:center;padding:4px;}
  .hist-info{flex:1;}
  .hist-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
  .hist-date{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .hist-ratings{display:flex;gap:16px;margin-top:6px;font-size:12px;}
  .hist-ratings .lbl{color:var(--text-faint);display:block;font-size:10px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .empty-state .display{font-size:20px;color:var(--text-dim);margin-bottom:8px;}

  @media (max-width:640px){
    .nav{padding:16px 0;}
    .search-wrap{flex-direction:column;padding:10px;}
    .btn-find{padding:12px;}
  }
</style>
</head>

/* ---------- MODE BACKEND : bascule automatique sur une vraie base Postgres ----------
   Si un serveur (voir /server) répond sur BACKEND_CANDIDATES, l'app l'utilise pour
   la recherche/le scoring/les notes au lieu du catalogue local. Sans serveur détecté
   (cas normal dans l'artefact Claude), rien ne change par rapport à avant. */
const BACKEND_CANDIDATES = ["http://localhost:3001"];
let BACKEND_URL = null;
let backendStatsCache = {}; // id -> {qualityAvg, qualityCount, fitAvg, fitCount, likePct}
async function detectBackend(){
  for(const base of BACKEND_CANDIDATES){
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 1200);
      const resp = await fetch(base+"/api/health", {signal:ctrl.signal});
      clearTimeout(t);
      if(resp.ok){ const data = await resp.json(); BACKEND_URL = base; backendCatalogSize = data.catalogSize; return data.catalogSize; }
    }catch(e){ /* pas de serveur ici, on reste en mode local */ }
  }
  return null;
}
let backendCatalogSize = null;

}

function mergeIntoLiveMovies(movie){
  if(!LIVE_MOVIES.some(m=>m.id===movie.id)) LIVE_MOVIES.push(movie);
}
let cachedUserId = null;
function generateUuidV4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
async function getUserId(){
  if(cachedUserId) return cachedUserId;
  try{
    const r = await window.storage.get("movie_finder_user_id_v1", false);
    if(r && r.value){ cachedUserId = r.value; return cachedUserId; }
  }catch(e){ /* pas encore d'id stocké */ }
  const id = generateUuidV4();
  cachedUserId = id;
  try{ await window.storage.set("movie_finder_user_id_v1", id, false); }catch(e){ /* best-effort */ }
  return id;
}

const PLATFORMS = ["Netflix","Prime Video","Canal+","Disney+","Apple TV","Location","Achat"];
function simulatedAvailability(id){
  // déterministe (basé sur l'id) pour rester stable entre rendus
  let seed=0; for(const c of id) seed+=c.charCodeAt(0);
  return PLATFORMS.filter((_,i)=>((seed+i*7)%5)<2);
}

/* ---------- 3. STOCKAGE PERSISTANT ---------- */
const USER_KEY="movie_finder_user_state_v1";
const STATS_KEY="movie_finder_community_stats_v1";
let userState = { watchHistory:[], searches:[] };
let communityDelta = {}; // {movieId:{qualitySum,qualityCount,fitSum,fitCount,likeCount}}
let storageReady=false;

async function loadState(){
  try{
    const u = await window.storage.get(USER_KEY,false);
    if(u && u.value) userState = JSON.parse(u.value);
  }catch(e){ /* pas encore de données personnelles */ }
  try{
    const s = await window.storage.get(STATS_KEY,true);
    if(s && s.value) communityDelta = JSON.parse(s.value);
  }catch(e){ /* pas encore de deltas communautaires */ }
  storageReady=true;
}
async function saveUserState(){
  try{ await window.storage.set(USER_KEY, JSON.stringify(userState), false); }
  catch(e){ console.warn("Sauvegarde historique impossible :", e); }
}
async function saveCommunityDelta(){
  try{ await window.storage.set(STATS_KEY, JSON.stringify(communityDelta), true); }
  catch(e){ console.warn("Sauvegarde stats communautaires impossible :", e); }
}

function getMovieStats(id){
  if(backendStatsCache[id]) return backendStatsCache[id];
  const base = BASELINE_STATS[id] || DEFAULT_LIVE_STATS;
  const d = communityDelta[id] || {qualitySum:0,qualityCount:0,fitSum:0,fitCount:0,likeCount:0};
  const qCount = base.qualityCount + d.qualityCount;
  const fCount = base.fitCount + d.fitCount;
  const qAvg = ((base.qualityAvg*base.qualityCount) + d.qualitySum) / qCount;
  const fAvg = ((base.fitAvg*base.fitCount) + d.fitSum) / fCount;
  const baseLikes = Math.round(base.fitCount * base.likePct/100);
  const likePct = Math.round(((baseLikes + d.likeCount) / fCount) * 100);
  return {qualityAvg:qAvg, qualityCount:qCount, fitAvg:fAvg, fitCount:fCount, likePct};
}

function recordRating(movieId, fitRating, qualityRating){
  if(!communityDelta[movieId]) communityDelta[movieId]={qualitySum:0,qualityCount:0,fitSum:0,fitCount:0,likeCount:0};
  const d = communityDelta[movieId];
  d.qualitySum += qualityRating; d.qualityCount += 1;
  d.fitSum += fitRating; d.fitCount += 1;
  if(fitRating>=4) d.likeCount += 1;
  saveCommunityDelta();
}

/* ---------- 4. INTERPRÉTATION DE LA RECHERCHE (LLM avec repli heuristique) ---------- */
const GENRE_VOCAB=["comedy","action","thriller","scifi","romance","drama","crime","adventure","musical"];
const MOOD_VOCAB=["funny","light","dark","feelgood","intense","cerebral","romantic","tense","uplifting","absurd"];
const CONTEXT_VOCAB=["couple","friends","family","solo","evening"];

async function parseQuery(text){
  try{
    const sys = `Tu transformes une requête de film en langage naturel (en français) en un objet JSON STRICT de critères structurés. Ne réponds QUE par du JSON valide, sans texte autour, sans balises markdown.
Schéma :
{
 "genres": [sous-ensemble de ${JSON.stringify(GENRE_VOCAB)}],
 "moods": [sous-ensemble de ${JSON.stringify(MOOD_VOCAB)}],
 "context": [sous-ensemble de ${JSON.stringify(CONTEXT_VOCAB)}],
 "countries": [pays mentionnés, ex "France"],
 "actors": [noms d'acteurs mentionnés],
 "year_min": nombre ou null,
 "year_max": nombre ou null,
 "max_runtime": nombre de minutes ou null,
 "max_intensity": 0-10 ou null,
 "max_violence": 0-10 ou null,
 "max_complexity": 0-10 ou null,
 "min_humor": 0-10 ou null
}
Tu NE dois PAS inventer de titres de films. Tu structures uniquement l'intention.`;
    const resp = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:400,
        system: sys,
        messages:[{role:"user",content:text}]
      })
    });
    const data = await resp.json();
    const raw = data.content.map(b=>b.text||"").join("").trim();
    const clean = raw.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(clean);
    parsed._source="llm";
    return parsed;
  }catch(e){
    return heuristicParse(text);
  }
}

function heuristicParse(text){
  const t = text.toLowerCase();
  const parsed = {genres:[],moods:[],context:[],countries:[],actors:[],year_min:null,year_max:null,max_runtime:null,max_intensity:null,max_violence:null,max_complexity:null,min_humor:null,_source:"heuristique"};
  const map = {
    "drôle":["comedy",["funny"]], "comédie":["comedy",["light"]], "rigolo":["comedy",["funny"]],
    "action":["action",["intense"]], "thriller":["thriller",["tense"]], "polar":["crime",["dark"]],
    "science-fiction":["scifi",["cerebral"]], "sci-fi":["scifi",["cerebral"]],
    "romance":["romance",["romantic"]], "amour":["romance",["romantic"]],
    "drame":["drama",[]],
  };
  for(const key in map){
    if(t.includes(key)){ parsed.genres.push(map[key][0]); parsed.moods.push(...map[key][1]); }
  }
  if(t.includes("léger")||t.includes("pas prise de tête")) { parsed.moods.push("light"); parsed.max_complexity=4; parsed.max_intensity=4; }
  if(t.includes("sombre")) parsed.moods.push("dark");
  if(t.includes("intelligent")||t.includes("réfléch")) parsed.moods.push("cerebral");
  if(t.includes("pas trop violent")||t.includes("sans violence")) parsed.max_violence=3;
  if(t.includes("français")||t.includes("france")) parsed.countries.push("France");
  if(t.includes("copine")||t.includes("copain")||t.includes("deux")||t.includes("couple")) parsed.context.push("couple");
  if(t.includes("amis")||t.includes("potes")) parsed.context.push("friends");
  const yearMatch = t.match(/années?\s*(19|20)?(\d0)/);
  if(yearMatch){ const decade = parseInt((yearMatch[1]||"20")+yearMatch[2]); parsed.year_min=decade; parsed.year_max=decade+9; }
  const runtimeMatch = t.match(/moins de\s*(\d)\s*h/);
  if(runtimeMatch) parsed.max_runtime = parseInt(runtimeMatch[1])*60;
  // acteurs connus mentionnés
  const knownActors = ["russell crowe","keanu reeves","denzel washington","brad pitt","leonardo dicaprio",
    "tom cruise","matt damon","bruce willis","keira knightley","daniel craig","jake gyllenhaal",
    "tom hanks","al pacino","morgan freeman","scarlett johansson","margot robbie","ryan gosling",
    "harrison ford","christian bale","paul giamatti"];
  knownActors.forEach(a=>{ if(t.includes(a)) parsed.actors.push(a); });
  parsed.genres=[...new Set(parsed.genres)]; parsed.moods=[...new Set(parsed.moods)]; parsed.context=[...new Set(parsed.context)];
  return parsed;
}

function criteriaTags(parsed){
  const tags=[];
  (parsed.genres||[]).forEach(g=>tags.push(g));
  (parsed.moods||[]).forEach(m=>tags.push(m));
  (parsed.context||[]).forEach(c=>tags.push(c));
  (parsed.countries||[]).forEach(c=>tags.push(c));
  (parsed.actors||[]).forEach(a=>tags.push(a));
  if(parsed.year_min) tags.push(`${parsed.year_min}–${parsed.year_max||''}`);
  if(parsed.max_runtime) tags.push(`< ${Math.round(parsed.max_runtime/60)}h`);
  return tags;
}

/** Version pour le nouveau moteur semantique (forme {required:{genres:[]}, moods:[], min:{}, max:{}}). Debug uniquement. */
function semanticCriteriaTags(parsed){
  const tags=[];
  (parsed.required?.genres||[]).forEach(g=>tags.push(`genre obligatoire: ${g}`));
  (parsed.moods||[]).forEach(m=>tags.push(`mood: ${m}`));
  for(const k in (parsed.min||{})) tags.push(`min ${k}: ${parsed.min[k]}`);
  for(const k in (parsed.max||{})) tags.push(`max ${k}: ${parsed.max[k]}`);
  return tags;
}

/* ---------- 5. PROFIL UTILISATEUR (personnalisation progressive) ---------- */
function buildUserProfile(){
  const genreStats={}, runtimes=[];
  userState.watchHistory.forEach(w=>{
    const movie = MOVIES.concat(LIVE_MOVIES).find(m=>m.id===w.movieId);
    if(!movie) return;
    movie.genres.forEach(g=>{
      if(!genreStats[g]) genreStats[g]={sum:0,count:0};
      genreStats[g].sum += w.qualityRating; genreStats[g].count += 1;
    });
    runtimes.push({runtime:movie.runtime, rating:w.qualityRating});
  });
  let preferredRuntime = null;
  if(runtimes.length){
    const weighted = runtimes.reduce((a,r)=>a+r.runtime*r.rating,0);
    const weightSum = runtimes.reduce((a,r)=>a+r.rating,0) || 1;
    preferredRuntime = weighted/weightSum;
  }
  return {genreStats, preferredRuntime};
}

/* ---------- 6. MOTEUR DE SCORING ---------- */
function scoreMovie(movie, parsed, profile){
  // a) pertinence par rapport à la recherche (0-100)
  let match=0, maxMatch=0;
  if(parsed.genres && parsed.genres.length){
    maxMatch+=40; if(movie.genres.some(g=>parsed.genres.includes(g))) match+=40;
  }
  if(parsed.moods && parsed.moods.length){
    maxMatch+=25;
    const overlap = movie.moods.filter(m=>parsed.moods.includes(m)).length;
    match += Math.min(25, overlap*13);
  }
  if(parsed.countries && parsed.countries.length){
    maxMatch+=10; if(parsed.countries.includes(movie.country)) match+=10;
  }
  if(parsed.actors && parsed.actors.length){
    maxMatch+=15;
    if(movie.actors.some(a=>parsed.actors.some(pa=>a.toLowerCase().includes(pa)))) match+=15;
  }
  if(parsed.year_min || parsed.year_max){
    maxMatch+=10;
    const okMin = !parsed.year_min || movie.year>=parsed.year_min;
    const okMax = !parsed.year_max || movie.year<=parsed.year_max;
    if(okMin && okMax) match+=10;
  }
  maxMatch = maxMatch || 1;
  let searchMatch = (match/maxMatch)*100;
  if(parsed.max_runtime && movie.runtime>parsed.max_runtime) searchMatch *= 0.35;
  if(parsed.max_violence!=null && movie.violence>parsed.max_violence) searchMatch *= 0.4;
  if(parsed.max_intensity!=null && movie.intensity>parsed.max_intensity) searchMatch *= 0.5;
  if(parsed.max_complexity!=null && movie.complexity>parsed.max_complexity) searchMatch *= 0.6;
  if(parsed.min_humor!=null && movie.humor<parsed.min_humor) searchMatch *= 0.6;

  // b) adéquation historique communautaire pour ce type de recherche (proxy : fitAvg du film)
  const stats = getMovieStats(movie.id);
  const searchFit = (stats.fitAvg/5)*100;

  // c) qualité communautaire
  const quality = (stats.qualityAvg/5)*100;

  // d) personnalisation
  let personalization=50;
  const gStat = movie.genres.map(g=>profile.genreStats[g]).filter(Boolean);
  if(gStat.length){
    const avg = gStat.reduce((a,s)=>a+s.sum/s.count,0)/gStat.length;
    personalization = (avg/5)*100;
  }
  if(profile.preferredRuntime){
    const diff = Math.abs(movie.runtime - profile.preferredRuntime);
    personalization = personalization*0.7 + Math.max(0,100-diff)*0.3;
  }

  // e) popularité (log-scale, pour éviter l'effet de bulle : poids volontairement faible)
  const popularity = Math.min(100, Math.log10(stats.qualityCount+1)*28);

  const total =
    searchMatch * (WEIGHTS.SEARCH_MATCH_WEIGHT/100) +
    searchFit * (WEIGHTS.SEARCH_FIT_WEIGHT/100) +
    quality * (WEIGHTS.QUALITY_WEIGHT/100) +
    personalization * (WEIGHTS.PERSONALIZATION_WEIGHT/100) +
    popularity * (WEIGHTS.POPULARITY_WEIGHT/100);

  return {total, searchMatch, searchFit, quality, personalization, popularity};
}

/* ---------- 6bis. CONTRAINTES EXPLICITES (filtrage DUR, pas une simple pondération) ----------
   Une contrainte explicite (durée max, acteur demandé) élimine un film de la
   liste des candidats — elle n'est jamais "compensée" par une bonne note. */
function passesHardConstraints(movie, parsed){
  if(parsed.max_runtime && movie.runtime > parsed.max_runtime) return false;
  if(parsed.actors && parsed.actors.length){
    const hasActor = movie.actors.some(a=>parsed.actors.some(pa=>a.toLowerCase().includes(pa)));
    if(!hasActor) return false;
  }
  return true;
}

function recommend(parsed, excludeIds, n=3){
  const profile = buildUserProfile();
  const watchedIds = new Set(userState.watchHistory.map(w=>w.movieId));
  const pool = MOVIES.concat(LIVE_MOVIES);
  let candidates = pool.filter(m=>!excludeIds.has(m.id) && !watchedIds.has(m.id));
  // 1) contraintes explicites : filtrage dur d'abord
  const hardFiltered = candidates.filter(m=>passesHardConstraints(m,parsed));
  // repli gracieux : si le filtrage dur ne laisse rien (catalogue encore limité), on
  // relâche uniquement pour ne jamais renvoyer un écran vide — mais on le signale.
  let relaxed = false;
  if(hardFiltered.length===0 && candidates.length>0){ relaxed = true; }
  else { candidates = hardFiltered; }
  const scored = candidates.map(m=>({movie:m, score:scoreMovie(m,parsed,profile)}));
  scored.sort((a,b)=>b.score.total-a.score.total);
  const results = scored.slice(0,n);
  results.relaxed = relaxed;
  return results;
}

function whyText(movie, parsed){
  const bits=[];
  if(parsed.genres&&parsed.genres.length) bits.push(labelGenres(parsed.genres));
  if(parsed.countries&&parsed.countries.length) bits.push(parsed.countries.join(", "));
  if(parsed.moods&&parsed.moods.length) bits.push(labelMoods(parsed.moods));
  if(parsed.year_min) bits.push(`des années ${parsed.year_min}`);
  if(parsed.max_runtime) bits.push(`de moins de ${Math.round(parsed.max_runtime/60)}h`);
  const intro = bits.length ? `Tu cherchais ${bits.join(", ")}.` : `Tu cherchais quelque chose de précis.`;
  const rt = `${Math.floor(movie.runtime/60)}h${String(movie.runtime%60).padStart(2,'0')}`;
  return `${intro} Celui-ci dure ${rt} et correspond bien à ce type de recherche.`;
}
function labelGenres(gs){ const L={comedy:"une comédie",action:"de l'action",thriller:"un thriller",scifi:"de la science-fiction",romance:"une romance",drama:"un drame",crime:"un polar",adventure:"de l'aventure",musical:"une comédie musicale"}; return gs.map(g=>L[g]||g).join(" / "); }
function labelMoods(ms){ const L={funny:"drôle",light:"léger",dark:"sombre",feelgood:"feel-good",intense:"intense",cerebral:"qui fait réfléchir",romantic:"romantique",tense:"tendu",uplifting:"positif",absurd:"absurde"}; return ms.map(m=>L[m]||m).join(", "); }

  if(cancel) cancel.onclick = closeModal;
  const starsFitEl = document.getElementById("stars-fit");
  if(starsFitEl) starsFitEl.querySelectorAll("span").forEach(s=>s.onclick=()=>{ starsFit=parseInt(s.dataset.star); render(); });
  const starsQualityEl = document.getElementById("stars-quality");
  if(starsQualityEl) starsQualityEl.querySelectorAll("span").forEach(s=>s.onclick=()=>{ starsQuality=parseInt(s.dataset.star); render(); });
  const saveBtn = document.getElementById("modal-save");
  if(saveBtn) saveBtn.onclick = saveRating;
}

function closeModal(){ ratingModalMovie=null; render(); }

async function saveRating(){
  if(!starsFit||!starsQuality) return;
  const m = ratingModalMovie;
  userState.watchHistory.push({movieId:m.id, searchId:currentSearchId, fitRating:starsFit, qualityRating:starsQuality, watchedAt:new Date().toISOString()});
  recordRating(m.id, starsFit, starsQuality);
  await saveUserState();
  if(BACKEND_URL){
    try{
      const userId = await getUserId();
      await fetch(BACKEND_URL+"/api/rating", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({userId, movieId:m.id, searchId:currentSearchId, fitRating:starsFit, qualityRating:starsQuality})
      });
    }catch(e){ console.warn("Note non synchronisée avec le serveur (conservée en local) :", e.message); }
  }
  ratingModalMovie=null;
  render();
}

async function doSearch(text){
  if(!text) return;
  lastQuery = text;
  view = "results";
  isLoading = true;
  sessionShown = new Set();
  showCriteria = false;
  render();

  // --- Mode moteur semantique (prioritaire si detecte) : le frontend NE fait AUCUN
  // parsing/scoring lui-meme ici, tout vient du serveur (cf. server/semantic-search.js). ---
  if(SEMANTIC_BACKEND_URL){
    try{
      const resp = await fetch(SEMANTIC_BACKEND_URL+"/api/semantic-search", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({query:text, excludeIds:[...sessionShown]})
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error||"erreur moteur semantique");
      lastParsed = data.parsed;
      currentResults = data.results.map(r=>({movie:r.movie, score:r.score, explanation:r.explanation}));
      data.results.forEach(r=>{ sessionShown.add(r.movie.id); mergeIntoLiveMovies(r.movie); });
      isLoading=false; render();
      return;
    }catch(e){
      console.warn("Moteur semantique indisponible, repli sur le fonctionnement existant :", e.message);
      SEMANTIC_BACKEND_URL = null; // pas de nouvelle tentative dans cette session
    }
  }

  const parsed = await parseQuery(text);
  lastParsed = parsed;

  if(BACKEND_URL){
    try{
      const userId = await getUserId();
      const resp = await fetch(BACKEND_URL+"/api/recommend", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({parsed, query:text, userId, excludeIds:[...sessionShown]})
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error||"erreur serveur");
      currentSearchId = data.searchId;
      currentResults = data.results.map(r=>({movie:r.movie, score:r.score}));
      currentResults.relaxed = data.results[0]?.relaxed;
      data.results.forEach(r=>{ backendStatsCache[r.movie.id]=r.stats; sessionShown.add(r.movie.id); mergeIntoLiveMovies(r.movie); });
      isLoading=false; render();
      return;
    }catch(e){
      console.warn("Backend indisponible, repli sur le catalogue local :", e.message);
      BACKEND_URL = null; // on ne réessaie pas à chaque appel dans la même session
    }
  }

  currentSearchId = "s_"+Date.now();
  userState.searches.push({id:currentSearchId, query:text, parsedQuery:parsed, createdAt:new Date().toISOString()});
  saveUserState();
  const results = recommend(parsed, sessionShown, 3);
  results.forEach(r=>sessionShown.add(r.movie.id));
  currentResults = results;
  isLoading = false;
  render();
}

async function doMore(){
  isLoading = true;
  render();

  if(SEMANTIC_BACKEND_URL){
    try{
      const resp = await fetch(SEMANTIC_BACKEND_URL+"/api/semantic-search", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({query:lastQuery, excludeIds:[...sessionShown]})
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error||"erreur moteur semantique");
      const results = data.results.map(r=>({movie:r.movie, score:r.score, explanation:r.explanation}));
      data.results.forEach(r=>{ sessionShown.add(r.movie.id); mergeIntoLiveMovies(r.movie); });
      currentResults = results.length ? results : currentResults;
      isLoading=false; render();
      return;
    }catch(e){
      console.warn("Moteur semantique indisponible pour '3 autres', repli existant :", e.message);
    }
  }

  if(BACKEND_URL){
    try{
      const userId = await getUserId();
      const resp = await fetch(BACKEND_URL+"/api/recommend", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({parsed:lastParsed, userId, excludeIds:[...sessionShown], searchId:currentSearchId})
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error||"erreur serveur");
      const results = data.results.map(r=>({movie:r.movie, score:r.score}));
      results.relaxed = data.results[0]?.relaxed;
      data.results.forEach(r=>{ backendStatsCache[r.movie.id]=r.stats; sessionShown.add(r.movie.id); mergeIntoLiveMovies(r.movie); });
      currentResults = results.length ? results : currentResults;
      isLoading=false; render();
      return;
    }catch(e){
      console.warn("Backend indisponible pour '3 autres', repli local :", e.message);
    }
  }

  await new Promise(res=>setTimeout(res,550));
  const results = recommend(lastParsed, sessionShown, 3);
  results.forEach(r=>sessionShown.add(r.movie.id));
  currentResults = results.length ? results : currentResults;
  isLoading = false;
  render();
}

/* ---------- BOOT ---------- */
(async function init(){
  await loadState();
  await detectBackend();
  await detectSemanticBackend();
  render();
})();
</script>
